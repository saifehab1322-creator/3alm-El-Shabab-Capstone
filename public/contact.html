<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا — 3ALM ELSHABAB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stadium-page.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/ltr.css">
</head>
<body data-page="contact">
<main>
<div class="page-wrap mid">
  <p class="section-label">Contact</p><h1 class="section-title" style="font-size:2rem;margin-bottom:8px;">تواصل معنا</h1>
  <p class="hint" style="margin-bottom:24px;">لأي استفسار عن الحجز أو إضافة ملعبك للمنصة، راسلنا وسنرد في أقرب وقت. support@3almelshabab.com</p>
  <div class="panel"><form id="contactForm" class="form-grid" novalidate>
    <div class="form-group"><label for="cname">الاسم</label><input id="cname" name="name" autocomplete="name"></div>
    <div class="form-group"><label for="cemail">البريد الإلكتروني</label><input id="cemail" name="email" type="email" dir="ltr" autocomplete="email"></div>
    <div class="form-group full"><label for="csubject">الموضوع</label><input id="csubject" name="subject"></div>
    <div class="form-group full"><label for="cmsg">الرسالة</label><textarea id="cmsg" name="message" rows="6"></textarea></div>
    <div class="full"><button class="btn-primary" type="submit">إرسال الرسالة</button></div>
    <p class="hint full" id="contactNote"></p>
  </form></div>
</div></main>
<footer>
  <span class="footer-brand">⚽ 3ALM ELSHABAB</span>
  <span>© 2026 — All Rights Reserved</span>
  <span>support@3almelshabab.com</span>
</footer>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/validators.js"></script>
<script src="js/ui.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
