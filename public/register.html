<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب — 3ALM ELSHABAB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stadium-page.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/ltr.css">
</head>
<body data-page="register">
<main>
<div class="page-wrap narrow">
  <div class="panel">
    <p class="section-label">Join us</p><h1 class="section-title" style="margin-bottom:20px;">إنشاء حساب جديد</h1>
    <form id="registerForm" class="form-stack" novalidate>
      <div class="form-group"><label for="rname">الاسم الكامل</label><input id="rname" name="name" autocomplete="name" placeholder="مثال: أحمد محمد"></div>
      <div class="form-group"><label for="remail">البريد الإلكتروني</label><input id="remail" name="email" type="email" autocomplete="email" dir="ltr" placeholder="name@example.com"></div>
      <div class="form-group"><label for="rphone">رقم الموبايل</label><input id="rphone" name="phone" type="tel" autocomplete="tel" dir="ltr" placeholder="01012345678"></div>
      <div class="form-group"><label for="rpass">كلمة المرور</label><input id="rpass" name="password" type="password" autocomplete="new-password" dir="ltr"><span class="hint">8 أحرف على الأقل، وبها حرف كبير وحرف صغير ورقم.</span></div>
      <div class="form-group"><label for="rpass2">تأكيد كلمة المرور</label><input id="rpass2" name="confirm" type="password" autocomplete="new-password" dir="ltr"></div>
      <button class="btn-primary btn-block" type="submit">إنشاء الحساب</button>
      <p class="form-foot">لديك حساب بالفعل؟ <a href="login.html">سجّل الدخول</a></p>
      <p class="hint warn">نسخة تجريبية: الحسابات محفوظة داخل هذا المتصفح فقط، وليست نظام مصادقة آمنًا.</p>
    </form>
  </div>
</div></main>
<footer>
  <span class="footer-brand">⚽ 3ALM ELSHABAB</span>
  <span>© 2026 — All Rights Reserved</span>
  <span>support@3almelshabab.com</span>
</footer>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/validators.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
