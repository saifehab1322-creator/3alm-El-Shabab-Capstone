<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول أصحاب الملاعب — 3ALM ELSHABAB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body data-page="owner-login">
<main>
<div class="page-wrap narrow">
  <div class="panel">
    <p class="section-label">Stadium Owners</p><h1 class="section-title" style="margin-bottom:20px;">دخول أصحاب الملاعب</h1>
    <form id="ownerLoginForm" class="form-stack" novalidate>
      <div class="form-group"><label for="olemail">البريد الإلكتروني</label><input id="olemail" name="email" type="email" autocomplete="email" dir="ltr"></div>
      <div class="form-group"><label for="olpass">كلمة المرور</label><input id="olpass" name="password" type="password" autocomplete="current-password" dir="ltr"></div>
      <button class="btn-primary btn-block" type="submit">دخول</button>
      <p class="form-foot">لديك كود تفعيل ولم تسجّل بعد؟ <a href="owner-register.html">سجّل ملعبك</a></p>
      <p class="form-foot">لست صاحب ملعب؟ <a href="login.html">دخول المستخدمين</a></p>
    </form>
  </div>
</div></main>
