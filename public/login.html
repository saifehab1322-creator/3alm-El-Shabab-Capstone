<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — 3ALM ELSHABAB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stadium-page.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/ltr.css">
</head>
<body data-page="login">
<main>
<div class="page-wrap narrow">
  <div class="panel">
    <p class="section-label">Welcome back</p><h1 class="section-title" style="margin-bottom:20px;">تسجيل الدخول</h1>
    <form id="loginForm" class="form-stack" novalidate>
      <div class="form-group"><label for="lemail">البريد الإلكتروني</label><input id="lemail" name="email" type="email" autocomplete="email" dir="ltr" placeholder="name@example.com"></div>
      <div class="form-group"><label for="lpass">كلمة المرور</label><input id="lpass" name="password" type="password" autocomplete="current-password" dir="ltr"></div>
      <button class="btn-primary btn-block" type="submit">دخول</button>
      <p class="form-foot">ليس لديك حساب؟ <a href="register.html">أنشئ حسابًا</a></p>
      <p class="hint warn">نسخة تجريبية: الحسابات محفوظة داخل هذا المتصفح فقط، وليست نظام مصادقة آمنًا. لاستخدام حقيقي يلزم خادم وقاعدة بيانات.</p>
    </form>
  </div>
</div></main>
<footer>
  <span class="footer-brand">⚽ 3ALM ELSHABAB</span>
  <span>© 2026 — All Rights Reserved</span>
  <span>support@3almelshabab.com</span>
</footer>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/validators.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
